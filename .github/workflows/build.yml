name: Build and release Ambient Music Mod

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TOOLS: 34.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-32
            platforms;android-33
            platforms;android-35
            build-tools;34.0.0

      - name: Set up Gradle (wrapper pins Gradle 8.10; AGP 8.5.2 is pinned in build.gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: Check secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret $v is missing or empty (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Read versionName and check tag
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(grep -E "^def tagName *= *'" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read tagName from app/build.gradle"; exit 1
          fi
          echo "versionName=$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' must equal versionName '$VERSION', otherwise the app will think an update is always pending"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode keystore and write local.properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::Decoded keystore is empty; KEYSTORE_B64 is not valid base64"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null \
            || { echo "::error::Keystore cannot be opened with STORE_PASSWORD/KEY_ALIAS"; exit 1; }
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace -PgithubOwner=${{ github.repository_owner }}

      - name: Locate and verify APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$APK" ]; then echo "::error::No release APK was produced"; exit 1; fi
          OUT="AmbientMusicMod-${{ steps.ver.outputs.version }}.apk"
          cp "$APK" "$OUT"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT" | tee verify.txt
          grep -q "Verified using v2 scheme.*true\|Verified using v3 scheme.*true" verify.txt \
            || { echo "::error::APK is not signed (v2/v3)"; exit 1; }
          echo "::notice::Signer SHA-256 (must be IDENTICAL to the Now Playing APK): $(grep -m1 'certificate SHA-256 digest' verify.txt)"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-${{ steps.ver.outputs.version }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish GitHub Release (not a draft, tag = versionName)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          F="${{ steps.apk.outputs.file }}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" "$F" --clobber
            gh release edit "$V" --draft=false --latest
          else
            gh release create "$V" "$F" --target "$GITHUB_SHA" --title "Ambient Music Mod $V" \
              --notes "Ambient Music Mod $V (fork build with resumable download diagnostics)." --latest
          fi
