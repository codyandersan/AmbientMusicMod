name: Build & Release Ambient Music Mod

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish non-draft GitHub Release (tagged with versionName)'
        required: false
        default: 'true'
        type: boolean
  push:
    tags:
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK (API 35, Build-Tools 35.0.0)
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-34" "platforms;android-33" "platforms;android-32" "build-tools;35.0.0"

      - name: Decode Keystore & Configure local.properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Missing required signing secrets (KEYSTORE_B64, KEY_ALIAS, STORE_PASSWORD, KEY_PASSWORD). Please configure all four in Repository Secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Decoded keystore is empty or invalid base64!"
            exit 1
          fi
          cat <<EOF_PROPS > local.properties
          sdk.dir=$ANDROID_HOME
          storeFile=$RUNNER_TEMP/release.keystore
          keyAlias=$KEY_ALIAS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF_PROPS
          echo "Configured local.properties with keystore at $RUNNER_TEMP/release.keystore"

      - name: Extract versionName from app/build.gradle
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -E "def tagName\s*=" app/build.gradle | head -n1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Failed to parse tagName (versionName) from app/build.gradle"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved AMM versionName / tag: $VERSION_NAME"

      - name: Run Unit Tests & Assemble Release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace --no-daemon

      - name: Verify Signed APK & Rename
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::Release APK was not found under app/build/outputs/apk/release/"
            exit 1
          fi
          OUT_APK="app/build/outputs/apk/release/AmbientMusicMod-${VERSION_NAME}.apk"
          cp "$RAW_APK" "$OUT_APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmbientMusicMod-${{ steps.version.outputs.version_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish Non-Draft GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish_release != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          TAG="$VERSION_NAME"
          echo "Publishing non-draft GitHub Release with tag '$TAG' and asset '$APK_PATH'..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH#AmbientMusicMod-${VERSION_NAME}.apk" --clobber
            gh release edit "$TAG" --draft=false --title "$VERSION_NAME"
          else
            gh release create "$TAG" "$APK_PATH#AmbientMusicMod-${VERSION_NAME}.apk" \
              --title "$VERSION_NAME" \
              --notes "Automated signed release of Ambient Music Mod v${VERSION_NAME}." \
              --draft=false
          fi
